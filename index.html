<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games of the Future 2026 — Schedule</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏀%3C/text%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <style>
        /* ===== ШРИФТЫ ===== */
        @font-face {
            font-family: 'PHGTL';
            src: url('https://raw.githubusercontent.com/dserdyukov/dserdyukov.github.io/main/fonts/PHGTL.ttf') format('truetype');
        }
        @font-face {
            font-family: 'PHGTL_KZ';
            src: url('https://raw.githubusercontent.com/dserdyukov/dserdyukov.github.io/main/fonts/PHGTL_kz.ttf') format('truetype');
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'PHGTL', 'Orbitron', 'Segoe UI', Arial, sans-serif;
            color: #fff;
            background: #070b18;
        }
        body.lang-kz {
            font-family: 'PHGTL_KZ', 'Orbitron', 'Segoe UI', Arial, sans-serif !important;
        }
        .bg-custom {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: url('https://raw.githubusercontent.com/dserdyukov/dserdyukov.github.io/main/IMG_20260225_165332_463.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.4);
        }
        #pages-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
        }
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.8s ease;
            opacity: 0;
            pointer-events: none;
            overflow-y: auto;
        }
        .page.active {
            opacity: 1;
            pointer-events: auto;
        }
        .page.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .content {
            width: 100%;
            max-width: 1000px;
            background: rgba(10, 15, 35, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 30px 25px 40px;
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.2);
            max-height: 90vh;
            overflow-y: auto;
        }
        .date-header {
            text-align: center;
            font-size: clamp(1.8rem, 5vw, 3.2rem);
            text-shadow: 0 0 20px cyan, 0 0 40px magenta;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }
        .sport-title {
            font-size: clamp(1.5rem, 4vw, 2.4rem);
            border-bottom: 2px solid rgba(0, 255, 255, 0.4);
            padding-bottom: 8px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px cyan;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
        }
        .sport-title .emoji {
            font-size: 2rem;
            flex-shrink: 0;
        }
        .sport-title span:last-child {
            flex-shrink: 0;
        }
        .games-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .game-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border-left: 4px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            font-size: clamp(0.95rem, 1.8vw, 1.3rem);
            gap: 8px 15px;
        }
        .game-item .time {
            font-weight: 700;
            color: #8cf0ff;
            min-width: 100px;
            flex-shrink: 0;
            font-size: clamp(1rem, 1.6vw, 1.2rem);
        }
        .game-item .teams {
            flex: 1;
            color: #eee;
            word-break: break-word;
            text-align: left;
            padding: 0 10px;
        }
        .game-item .status {
            font-size: 0.8rem;
            padding: 4px 14px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.08);
            color: #aaa;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
            text-align: center;
            min-width: 80px;
        }
        /* ===== СТАТУСЫ ===== */
        .game-item.live {
            border-left-color: #00ff88;
            background: rgba(0, 255, 136, 0.25);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }
        .game-item.live .status {
            background: #00ff88;
            color: #000;
            font-weight: 700;
            border-color: #00ff88;
        }
        .game-item.past {
            border-left-color: #666;
            background: rgba(100, 100, 100, 0.15);
            opacity: 0.6;
        }
        .game-item.past .status {
            background: #555;
            color: #bbb;
            border-color: #555;
        }
        .game-item.soon {
            border-left-color: #ffdd00;
            background: rgba(255, 221, 0, 0.15);
        }
        .game-item.soon .status {
            background: #ffdd00;
            color: #000;
            border-color: #ffdd00;
        }
        .game-item.upcoming {
            border-left-color: #4fc3f7;
            background: rgba(79, 195, 247, 0.08);
            opacity: 1;
        }
        .game-item.upcoming .status {
            background: #4fc3f7;
            color: #000;
            border-color: #4fc3f7;
        }
        /* Battle Royale – убираем блок команд */
        .game-item.battle .teams {
            display: none;
        }
        .game-item.battle .time {
            min-width: 100px;
        }
        .game-item.battle .status {
            min-width: 80px;
        }
        /* ===== СТИЛИ ДЛЯ ТАЙМЕРА (уменьшены) ===== */
        .timer-display {
            font-size: clamp(2rem, 8vw, 4.5rem);
            font-weight: 800;
            text-align: center;
            text-shadow: 0 0 30px cyan, 0 0 60px magenta;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }
        .timer-display .number {
            background: rgba(0, 0, 0, 0.4);
            padding: 0.05em 0.3em;
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        .timer-display .unit {
            font-size: clamp(0.8rem, 2vw, 1.4rem);
            margin: 0 0.2rem;
            color: #8cf0ff;
        }
        .timer-sub {
            text-align: center;
            font-size: clamp(0.9rem, 1.8vw, 1.2rem);
            color: #aaa;
            margin-top: 5px;
        }
        @media (max-width: 600px) {
            .content {
                padding: 20px 15px;
            }
            .game-item {
                padding: 10px 12px;
                flex-wrap: wrap;
                gap: 5px;
            }
            .game-item .time {
                min-width: 80px;
            }
            .game-item .status {
                min-width: 60px;
                font-size: 0.7rem;
                padding: 2px 10px;
            }
            .game-item .teams {
                flex-basis: 100%;
                padding-left: 0;
                margin-top: 4px;
            }
            .game-item.battle .teams {
                display: none;
            }
            .game-item.battle .time {
                min-width: 80px;
            }
            .timer-display {
                font-size: clamp(1.8rem, 7vw, 3.5rem);
                gap: 6px;
            }
            .timer-display .unit {
                font-size: clamp(0.7rem, 1.8vw, 1.2rem);
            }
        }
        .no-matches {
            text-align: center;
            font-size: 1.5rem;
            color: #aaa;
            padding: 40px 0;
        }
    </style>
</head>

        // ============================================================

                    { time: '16:30', teams: 'Loser 25 vs Loser 26' },

                ]
            }
        };

        // ============================================================
        // ========== ПЕРЕВОДЫ ========================================
        // ============================================================

        const langData = {
            en: {
                basketball: 'Basketball',
                battle: 'Battle Royale',
                football: 'Football',
                laser: 'Laser Tag',
                statusLive: '● LIVE',
                statusPast: 'Finished',
                statusSoon: '⏳ Soon',
                statusUpcoming: 'Upcoming',
                noMatches: 'No matches scheduled for today',
                months: ['January', 'February', 'March', 'April', 'May', 'June',
                    'July', 'August', 'September', 'October', 'November', 'December'
                ],
                timerTitle: 'Time left until the end',
                timerDays: 'days',
                timerHours: 'hours',
                timerSub: 'Games of the Future 2026'
            },
            kz: {
                basketball: 'Баскетбол',
                battle: 'Battle Royale',
                football: 'Футбол',
                laser: 'Лазертаг',
                statusLive: '● ЭФИРДЕ',
                statusPast: 'Аяқталды',
                statusSoon: '⏳ Жақында',
                statusUpcoming: 'Күтiлуде',
                noMatches: 'Бүгiн ойындар жоқ',
                months: ['Қаңтар', 'Ақпан', 'Наурыз', 'Сәуiр', 'Мамыр', 'Маусым',
                    'Шiлде', 'Тамыз', 'Қыркүйек', 'Қазан', 'Қараша', 'Желтоқсан'
                ],
                timerTitle: 'Аяқталғанға дейiн қалды',
                timerDays: 'күн',
                timerHours: 'сағат',
                timerSub: 'Болашақ Ойындары 2026'
            }
        };

        // ============================================================
        // ========== ТЕКУЩЕЕ СОСТОЯНИЕ ===============================
        // ============================================================

        let currentLang = 'en';
        let activePageIds = [];
        let currentPageIndex = 0;
        let pageIdCounter = 0; // для генерации уникальных ID

        const endDate = new Date(Date.UTC(2026, 7, 9, 14, 0, 0, 0));

        // ============================================================
        // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========================
        // ============================================================

        function getTodayStr() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getTodayData() {
            const today = getTodayStr();
            return schedule[today] || null;
        }

        function getAstanaTime() {
            const now = new Date();
            const utcHours = now.getUTCHours();
            const utcMinutes = now.getUTCMinutes();
            let astanaHours = utcHours + 5;
            if (astanaHours >= 24) astanaHours -= 24;
            return { hours: astanaHours, minutes: utcMinutes };
        }

        // ============================================================
        // ========== ЛОГИКА СТАТУСОВ ==================================
        // ============================================================

        function getStatus(gameTimeStr, nextGameTimeStr) {
            const [h, m] = gameTimeStr.split(':').map(Number);
            const now = getAstanaTime();
            const gameMinutes = h * 60 + m;
            const nowMinutes = now.hours * 60 + now.minutes;

            let endMinutes;
            if (nextGameTimeStr) {
                const [nh, nm] = nextGameTimeStr.split(':').map(Number);
                endMinutes = nh * 60 + nm;
            } else {
                endMinutes = gameMinutes + MATCH_DURATION;
            }

            if (nowMinutes < gameMinutes) {
                const diff = gameMinutes - nowMinutes;
                if (diff <= 15) return 'soon';
                else return 'upcoming';
            } else if (nowMinutes >= gameMinutes && nowMinutes < endMinutes) {
                return 'live';
            } else {
                return 'past';
            }
        }

        function getStatusText(statusKey) {
            const map = { live: 'statusLive', past: 'statusPast', soon: 'statusSoon', upcoming: 'statusUpcoming' };
            return langData[currentLang][map[statusKey]] || 'Upcoming';
        }

        function formatDate(dateStr) {
            const parts = dateStr.split('-');
            const year = parseInt(parts[0]);
            const month = parseInt(parts[1]) - 1;
            const day = parseInt(parts[2]);
            const monthName = langData[currentLang].months[month];
            return `${day} ${monthName} ${year}`;
        }

        // ============================================================
        // ========== ГЕНЕРАЦИЯ HTML ДЛЯ СТРАНИЦ ======================
        // ============================================================

        function generatePageHtml(title, emoji, dateStr, items, isBattle = false) {
            let listHtml = '';
            if (!items || items.length === 0) {
                listHtml = `<div class="no-matches">${langData[currentLang].noMatches}</div>`;
            } else {
                const sorted = [...items].sort((a, b) => {
                    const timeA = typeof a === 'string' ? a : a.time;
                    const timeB = typeof b === 'string' ? b : b.time;
                    return timeA.localeCompare(timeB);
                });
                sorted.forEach((item, index) => {
                    let time, teams;
                    if (typeof item === 'string') {
                        time = item;
                        teams = '';
                    } else {
                        time = item.time;
                        teams = item.teams;
                    }
                    const nextItem = (index < sorted.length - 1) ? sorted[index + 1] : null;
                    const nextTime = nextItem ? (typeof nextItem === 'string' ? nextItem : nextItem.time) : null;
                    const status = getStatus(time, nextTime);
                    const statusText = getStatusText(status);
                    const battleClass = isBattle ? ' battle' : '';
                    listHtml += `
                        <div class="game-item ${status}${battleClass}">
                            <span class="time">${time}</span>
                            ${isBattle ? '' : `<span class="teams">${teams}</span>`}
                            <span class="status">${statusText}</span>
                        </div>
                    `;
                });
            }
            return `
                <div class="content">
                    <div class="date-header">${dateStr}</div>
                    <div class="sport-title"><span class="emoji">${emoji}</span> <span>${title}</span></div>
                    <div class="games-list">${listHtml}</div>
                </div>
            `;
        }

        function generateTimerPageHtml() {
            return `
                <div class="content" style="text-align: center;">
                    <div class="date-header" id="timerHeader">${langData[currentLang].timerTitle}</div>
                    <div class="timer-display" id="timerDisplay">
                        <span class="number" id="timerDays">00</span>
                        <span class="unit" id="timerDaysLabel">${langData[currentLang].timerDays}</span>
                        <span class="number" id="timerHours">00</span>
                        <span class="unit" id="timerHoursLabel">${langData[currentLang].timerHours}</span>
                    </div>
                    <div class="timer-sub" id="timerSub">${langData[currentLang].timerSub}</div>
                </div>
            `;
        }

        // ============================================================
        // ========== ПОСТРОЕНИЕ СТРАНИЦ ==============================
        // ============================================================

        function buildPages() {
            const container = document.getElementById('pages-container');
            // Очищаем контейнер
            container.innerHTML = '';
            const today = getTodayStr();
            const data = getTodayData();
            const dateHeader = data ? formatDate(today) : langData[currentLang].noMatches;
            const pageIds = [];

            // Дисциплины и их настройки
            const disciplines = [
                { key: 'basketball', emoji: '🏀', title: langData[currentLang].basketball },
                { key: 'battle', emoji: '⚔️', title: langData[currentLang].battle },
                { key: 'football', emoji: '⚽', title: langData[currentLang].football },
                { key: 'laser', emoji: '🔫', title: langData[currentLang].laser }
            ];

            disciplines.forEach(disp => {
                const items = data && data[disp.key] ? data[disp.key] : null;
                if (!items || items.length === 0) return;

                const isBattle = (disp.key === 'battle');
                // Разбиваем на чанки
                const chunks = [];
                for (let i = 0; i < items.length; i += ITEMS_PER_PAGE) {
                    chunks.push(items.slice(i, i + ITEMS_PER_PAGE));
                }
                chunks.forEach((chunk, idx) => {
                    const pageId = `page-${disp.key}-${idx}`;
                    pageIds.push(pageId);
                    const html = generatePageHtml(disp.title, disp.emoji, dateHeader, chunk, isBattle);
                    const div = document.createElement('div');
                    div.id = pageId;
                    div.className = 'page hidden';
                    div.innerHTML = html;
                    container.appendChild(div);
                });
            });

            // Добавляем страницу таймера
            const timerId = 'page-timer';
            pageIds.push(timerId);
            const timerDiv = document.createElement('div');
            timerDiv.id = timerId;
            timerDiv.className = 'page hidden';
            timerDiv.innerHTML = generateTimerPageHtml();
            container.appendChild(timerDiv);

            // Обновляем activePageIds и currentPageIndex
            const oldActive = activePageIds;
            activePageIds = pageIds;
            // Если список изменился, сбрасываем индекс на 0
            if (oldActive.length !== activePageIds.length || oldActive.some((id, i) => id !== activePageIds[i])) {
                currentPageIndex = 0;
            } else {
                // Если не изменился, оставляем текущий индекс, но проверяем границы
                if (currentPageIndex >= activePageIds.length) currentPageIndex = 0;
            }
            // Показываем только текущую страницу
            document.querySelectorAll('.page').forEach(el => {
                el.classList.remove('active');
                el.classList.add('hidden');
            });
            const currentPage = document.getElementById(activePageIds[currentPageIndex]);
            if (currentPage) {
                currentPage.classList.remove('hidden');
                currentPage.classList.add('active');
            }
        }

        // ============================================================
        // ========== ОБНОВЛЕНИЕ СОДЕРЖИМОГО СТРАНИЦ =================
        // ============================================================

        function updatePagesContent() {
            // Перестраиваем страницы заново (простой способ)
            // Можно было бы обновлять только содержимое, но проще пересоздать
            buildPages();
            // Обновляем таймер (цифры)
            updateTimerDisplay();
        }

        // ============================================================
        // ========== ТАЙМЕР ===========================================
        // ============================================================

        function updateTimerDisplay() {
            const now = new Date();
            const diff = endDate - now;
            let days = 0, hours = 0;
            if (diff > 0) {
                days = Math.floor(diff / 86400000);
                hours = Math.floor((diff % 86400000) / 3600000);
            }
            const daysEl = document.getElementById('timerDays');
            const hoursEl = document.getElementById('timerHours');
            if (daysEl) daysEl.textContent = String(days).padStart(2, '0');
            if (hoursEl) hoursEl.textContent = String(hours).padStart(2, '0');
        }

        // ============================================================
        // ========== ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ И ЯЗЫКА ===================
        // ============================================================

        function switchPage() {
            if (activePageIds.length === 0) return;
            const pages = activePageIds.map(id => document.getElementById(id)).filter(el => el !== null);
            if (pages.length === 0) return;
            // Скрываем текущую
            const currentEl = document.getElementById(activePageIds[currentPageIndex]);
            if (currentEl) {
                currentEl.classList.remove('active');
                currentEl.classList.add('hidden');
            }
            // Переходим к следующей
            currentPageIndex = (currentPageIndex + 1) % pages.length;
            const nextEl = document.getElementById(activePageIds[currentPageIndex]);
            if (nextEl) {
                nextEl.classList.remove('hidden');
                nextEl.classList.add('active');
            }
        }

        function switchLanguage() {
            currentLang = (currentLang === 'en') ? 'kz' : 'en';
            // Перестраиваем страницы с новым языком
            buildPages();
            // Обновляем таймер (заголовки уже обновлены в buildPages)
            updateTimerDisplay();
            // Применяем класс для шрифта
            document.body.classList.toggle('lang-kz', currentLang === 'kz');
        }

        // ============================================================
        // ========== ЗАПУСК ==========================================
        // ============================================================

        // Начальное построение
        buildPages();
        // Применяем язык
        document.body.classList.toggle('lang-kz', currentLang === 'kz');

        // Запускаем таймеры
        setInterval(switchPage, 10000);
        setInterval(switchLanguage, 6000);
        setInterval(updateTimerDisplay, 1000);

        // Также обновляем содержимое страниц каждую секунду (для статусов)
        setInterval(() => {
            // Мы не можем перестраивать каждую секунду, это слишком ресурсоёмко.
            // Вместо этого обновляем только статусы в уже существующих страницах.
            // Но проще перестроить страницы, но это может быть медленно.
            // Оптимизируем: обновляем только классы статусов у элементов.
            // Для простоты пока оставим перестроение каждые 10 секунд вместе с языком? Нет, статусы должны обновляться часто.
            // Сделаем обновление статусов через перестройку, но раз в секунду – это нормально.
            // Однако при перестройке страницы мерцают. Лучше обновлять только статусы без перестройки.
            // Реализуем функцию updateStatuses(), которая обходит все .game-item и пересчитывает статусы.
            // Но это сложнее. Пока оставим перестроение раз в секунду – не должно сильно тормозить.
            // Если заметно мерцание, можно оптимизировать.
            buildPages();
            updateTimerDisplay();
        }, 1000);
    </script>
</body>
</html>
