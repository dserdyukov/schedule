<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games of the Future 2026 — Schedule</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏀%3C/text%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <style>
        /* ===== ШРИФТЫ ===== */
        @font-face {
            font-family: 'PHGTL';
            src: url('https://raw.githubusercontent.com/dserdyukov/dserdyukov.github.io/main/fonts/PHGTL.ttf') format('truetype');
        }
        @font-face {
            font-family: 'PHGTL_KZ';
            src: url('https://raw.githubusercontent.com/dserdyukov/dserdyukov.github.io/main/fonts/PHGTL_kz.ttf') format('truetype');
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'PHGTL', 'Orbitron', 'Segoe UI', Arial, sans-serif;
            color: #fff;
            background: #070b18;
        }
        body.lang-kz {
            font-family: 'PHGTL_KZ', 'Orbitron', 'Segoe UI', Arial, sans-serif !important;
        }
        .bg-custom {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: url('https://raw.githubusercontent.com/dserdyukov/dserdyukov.github.io/main/IMG_20260225_165332_463.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.4);
        }
        .page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.8s ease;
            opacity: 0;
            pointer-events: none;
            overflow-y: auto;
        }
        .page.active {
            opacity: 1;
            pointer-events: auto;
        }
        .page.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .content {
            width: 100%;
            max-width: 1000px;
            background: rgba(10, 15, 35, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 30px 25px 40px;
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.2);
            max-height: 90vh;
            overflow-y: auto;
        }
        .date-header {
            text-align: center;
            font-size: clamp(1.8rem, 5vw, 3.2rem);
            text-shadow: 0 0 20px cyan, 0 0 40px magenta;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }
        .sport-title {
            font-size: clamp(1.5rem, 4vw, 2.4rem);
            border-bottom: 2px solid rgba(0, 255, 255, 0.4);
            padding-bottom: 8px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px cyan;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
        }
        .sport-title .emoji {
            font-size: 2rem;
            flex-shrink: 0;
        }
        .sport-title span:last-child {
            flex-shrink: 0;
        }
        .games-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .game-item {
            display: flex;
            align-items: center;
            justify-content: space-between; /* время слева, статус справа */
            padding: 12px 18px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border-left: 4px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            font-size: clamp(0.95rem, 1.8vw, 1.3rem);
            gap: 8px 15px;
        }
        .game-item .time {
            font-weight: 700;
            color: #8cf0ff;
            min-width: 100px;      /* фиксированная ширина для времени */
            flex-shrink: 0;
            font-size: clamp(1rem, 1.6vw, 1.2rem);
        }
        .game-item .teams {
            flex: 1;
            color: #eee;
            word-break: break-word;
            text-align: left;
            padding: 0 10px;
        }
        .game-item .status {
            font-size: 0.8rem;
            padding: 4px 14px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.08);
            color: #aaa;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;       /* чтобы статус не сжимался */
            text-align: center;
            min-width: 80px;
        }
        /* ===== СТАТУСЫ ===== */
        .game-item.live {
            border-left-color: #00ff88;
            background: rgba(0, 255, 136, 0.25);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }
        .game-item.live .status {
            background: #00ff88;
            color: #000;
            font-weight: 700;
            border-color: #00ff88;
        }
        .game-item.past {
            border-left-color: #666;
            background: rgba(100, 100, 100, 0.15);
            opacity: 0.6;
        }
        .game-item.past .status {
            background: #555;
            color: #bbb;
            border-color: #555;
        }
        .game-item.soon {
            border-left-color: #ffdd00;
            background: rgba(255, 221, 0, 0.15);
        }
        .game-item.soon .status {
            background: #ffdd00;
            color: #000;
            border-color: #ffdd00;
        }
        .game-item.upcoming {
            border-left-color: #4fc3f7;
            background: rgba(79, 195, 247, 0.08);
            opacity: 1;
        }
        .game-item.upcoming .status {
            background: #4fc3f7;
            color: #000;
            border-color: #4fc3f7;
        }
        /* Battle Royale – убираем центрирование, наследуем общий стиль */
        .game-item.battle .teams {
            display: none;          /* скрываем блок команд */
        }
        .game-item.battle .time {
            min-width: 100px;
        }
        .game-item.battle .status {
            min-width: 80px;
        }
        /* ===== СТИЛИ ДЛЯ ТАЙМЕРА ===== */
        .timer-display {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 800;
            text-align: center;
            text-shadow: 0 0 30px cyan, 0 0 60px magenta;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }
        .timer-display .number {
            background: rgba(0, 0, 0, 0.4);
            padding: 0.1em 0.4em;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        .timer-display .unit {
            font-size: clamp(1rem, 2.5vw, 1.8rem);
            margin: 0 0.2rem;
            color: #8cf0ff;
        }
        .timer-sub {
            text-align: center;
            font-size: clamp(1rem, 2vw, 1.4rem);
            color: #aaa;
            margin-top: 10px;
        }
        @media (max-width: 600px) {
            .content {
                padding: 20px 15px;
            }
            .game-item {
                padding: 10px 12px;
                flex-wrap: wrap;
                gap: 5px;
            }
            .game-item .time {
                min-width: 80px;
            }
            .game-item .status {
                min-width: 60px;
                font-size: 0.7rem;
                padding: 2px 10px;
            }
            .game-item .teams {
                flex-basis: 100%;
                padding-left: 0;
                margin-top: 4px;
            }
            .game-item.battle .teams {
                display: none;
            }
            .game-item.battle .time {
                min-width: 80px;
            }
        }
        .no-matches {
            text-align: center;
            font-size: 1.5rem;
            color: #aaa;
            padding: 40px 0;
        }
    </style>
</head>
<body>

            // -------- 6 августа (Футбол + Лазертаг) --------
            '2026-08-06': {
                football: [

                ],
                laser: [

                    { time: '19:05', teams: '1st in Group B vs 2nd in Group A' }
                ]
            },
            // -------- 8 августа (Футбол + Лазертаг) --------
            '2026-08-08': {
                football: [
                    { time: '13:00', teams: 'Winner 21 vs Winner 22' },
                    { time: '14:15', teams: 'Winner 23 vs Winner 24' }
                ],
                laser: [

            },
            // -------- 9 августа (только Футбол) --------
            '2026-08-09': {
                football: [
                    { time: '16:30', teams: 'Loser 25 vs Loser 26' },
                    { time: '18:00', teams: 'Winner 25 vs Winner 26' }
                ]
            }
        };

        // ============================================================
        // ========== ПЕРЕВОДЫ ========================================
        // ============================================================

        const langData = {
            en: {
                basketball: 'Basketball',
                battle: 'Battle Royale',
                football: 'Football',
                laser: 'Laser Tag',
                statusLive: '● LIVE',
                statusPast: 'Finished',
                statusSoon: '⏳ Soon',
                statusUpcoming: 'Upcoming',
                noMatches: 'No matches scheduled for today',
                months: ['January', 'February', 'March', 'April', 'May', 'June',
                    'July', 'August', 'September', 'October', 'November', 'December'
                ],
                timerTitle: 'Time left until the end',
                timerDays: 'days',
                timerHours: 'hours',
                timerSub: 'Games of the Future 2026'
            },
            kz: {
                basketball: 'Баскетбол',
                battle: 'Battle Royale',
                football: 'Футбол',
                laser: 'Лазертаг',
                statusLive: '● ЭФИРДЕ',
                statusPast: 'Аяқталды',
                statusSoon: '⏳ Жақында',
                statusUpcoming: 'Күтiлуде',
                noMatches: 'Бүгiн ойындар жоқ',
                months: ['Қаңтар', 'Ақпан', 'Наурыз', 'Сәуiр', 'Мамыр', 'Маусым',
                    'Шiлде', 'Тамыз', 'Қыркүйек', 'Қазан', 'Қараша', 'Желтоқсан'
                ],
                timerTitle: 'Аяқталғанға дейiн қалды',
                timerDays: 'күн',
                timerHours: 'сағат',
                timerSub: 'Болашақ Ойындары 2026'
            }
        };

        // ============================================================
        // ========== ТЕКУЩЕЕ СОСТОЯНИЕ ===============================
        // ============================================================

        let currentLang = 'en';
        let activePageIds = [];
        let currentPageIndex = 0;

        // ЦЕЛЬ: 9 августа 2026, 19:00 по Астане → 14:00 UTC
        const endDate = new Date(Date.UTC(2026, 7, 9, 14, 0, 0, 0));

        // ============================================================
        // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========================
        // ============================================================

        function getTodayStr() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getTodayData() {
            const today = getTodayStr();
            return schedule[today] || null;
        }

        function getAstanaTime() {
            const now = new Date();
            const utcHours = now.getUTCHours();
            const utcMinutes = now.getUTCMinutes();
            let astanaHours = utcHours + 5;
            if (astanaHours >= 24) astanaHours -= 24;
            return { hours: astanaHours, minutes: utcMinutes };
        }

        // ============================================================
        // ========== ЛОГИКА СТАТУСОВ ==================================
        // ============================================================

        function getStatus(gameTimeStr, nextGameTimeStr) {
            const [h, m] = gameTimeStr.split(':').map(Number);
            const now = getAstanaTime();
            const gameMinutes = h * 60 + m;
            const nowMinutes = now.hours * 60 + now.minutes;

            let endMinutes;
            if (nextGameTimeStr) {
                const [nh, nm] = nextGameTimeStr.split(':').map(Number);
                endMinutes = nh * 60 + nm;
            } else {
                endMinutes = gameMinutes + MATCH_DURATION;
            }

            if (nowMinutes < gameMinutes) {
                const diff = gameMinutes - nowMinutes;
                if (diff <= 15) return 'soon';
                else return 'upcoming';
            } else if (nowMinutes >= gameMinutes && nowMinutes < endMinutes) {
                return 'live';
            } else {
                return 'past';
            }
        }

        function getStatusText(statusKey) {
            const map = { live: 'statusLive', past: 'statusPast', soon: 'statusSoon', upcoming: 'statusUpcoming' };
            return langData[currentLang][map[statusKey]] || 'Upcoming';
        }

        function formatDate(dateStr) {
            const parts = dateStr.split('-');
            const year = parseInt(parts[0]);
            const month = parseInt(parts[1]) - 1;
            const day = parseInt(parts[2]);
            const monthName = langData[currentLang].months[month];
            return `${day} ${monthName} ${year}`;
        }

        // ============================================================
        // ========== УНИВЕРСАЛЬНАЯ ОТРИСОВКА ==========================
        // ============================================================

        function renderSport(listId, data, isBattle = false) {
            const list = document.getElementById(listId);
            list.innerHTML = '';
            if (!data || data.length === 0) {
                list.innerHTML = `<div class="no-matches">${langData[currentLang].noMatches}</div>`;
                return;
            }
            const sorted = [...data].sort((a, b) => {
                const timeA = typeof a === 'string' ? a : a.time;
                const timeB = typeof b === 'string' ? b : b.time;
                return timeA.localeCompare(timeB);
            });
            sorted.forEach((item, index) => {
                let time, teams;
                if (typeof item === 'string') {
                    time = item;
                    teams = '';
                } else {
                    time = item.time;
                    teams = item.teams;
                }
                const nextItem = (index < sorted.length - 1) ? sorted[index + 1] : null;
                const nextTime = nextItem ? (typeof nextItem === 'string' ? nextItem : nextItem.time) : null;
                const status = getStatus(time, nextTime);
                const div = document.createElement('div');
                div.className = `game-item ${status}${isBattle ? ' battle' : ''}`;
                div.innerHTML = `
                    <span class="time">${time}</span>
                    ${isBattle ? '' : `<span class="teams">${teams}</span>`}
                    <span class="status">${getStatusText(status)}</span>
                `;
                list.appendChild(div);
            });
        }

        function updateHeaders(data) {
            const today = getTodayStr();
            const header = data ? formatDate(today) : langData[currentLang].noMatches;
            document.getElementById('dateHeaderBasket').textContent = header;
            document.getElementById('dateHeaderBattle').textContent = header;
            document.getElementById('dateHeaderFootball').textContent = header;
            document.getElementById('dateHeaderLaser').textContent = header;
            document.getElementById('basketballTitle').textContent = langData[currentLang].basketball;
            document.getElementById('battleTitle').textContent = langData[currentLang].battle;
            document.getElementById('footballTitle').textContent = langData[currentLang].football;
            document.getElementById('laserTitle').textContent = langData[currentLang].laser;
        }

        // ============================================================
        // ========== ОПРЕДЕЛЕНИЕ АКТИВНЫХ СТРАНИЦ ====================
        // ============================================================

        function getActivePages() {
            const data = getTodayData();
            const pages = [];
            if (data && data.basketball && data.basketball.length > 0) pages.push('page-basketball');
            if (data && data.battle && data.battle.length > 0) pages.push('page-battle');
            if (data && data.football && data.football.length > 0) pages.push('page-football');
            if (data && data.laser && data.laser.length > 0) pages.push('page-laser');
            // Таймер всегда добавляем
            pages.push('page-timer');
            return pages;
        }

        // ============================================================
        // ========== ТАЙМЕР ===========================================
        // ============================================================

        function updateTimer() {
            const now = new Date();
            const diff = endDate - now;
            let days = 0, hours = 0;
            if (diff > 0) {
                days = Math.floor(diff / 86400000);
                hours = Math.floor((diff % 86400000) / 3600000);
            }
            document.getElementById('timerDays').textContent = String(days).padStart(2, '0');
            document.getElementById('timerHours').textContent = String(hours).padStart(2, '0');
        }

        function renderTimer() {
            document.getElementById('timerHeader').textContent = langData[currentLang].timerTitle;
            document.getElementById('timerDaysLabel').textContent = langData[currentLang].timerDays;
            document.getElementById('timerHoursLabel').textContent = langData[currentLang].timerHours;
            document.getElementById('timerSub').textContent = langData[currentLang].timerSub;
            updateTimer();
        }

        // ============================================================
        // ========== ОБНОВЛЕНИЕ ВСЕГО ================================
        // ============================================================

        function renderAll() {
            const data = getTodayData();
            const basketData = data && data.basketball ? data.basketball : null;
            const battleData = data && data.battle ? data.battle : null;
            const footballData = data && data.football ? data.football : null;
            const laserData = data && data.laser ? data.laser : null;

            renderSport('basketballList', basketData, false);
            renderSport('battleList', battleData, true);
            renderSport('footballList', footballData, false);
            renderSport('laserList', laserData, false);

            updateHeaders(data);
            renderTimer();
            document.body.classList.toggle('lang-kz', currentLang === 'kz');

            // Обновляем список активных страниц
            const newActive = getActivePages();
            if (newActive.length !== activePageIds.length || 
                newActive.some((id, i) => id !== activePageIds[i])) {
                activePageIds = newActive;
                if (currentPageIndex >= activePageIds.length) {
                    currentPageIndex = 0;
                }
                document.querySelectorAll('.page').forEach(el => {
                    el.classList.remove('active');
                    el.classList.add('hidden');
                });
                const currentPage = document.getElementById(activePageIds[currentPageIndex]);
                if (currentPage) {
                    currentPage.classList.remove('hidden');
                    currentPage.classList.add('active');
                }
            }
        }

        // ============================================================
        // ========== ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ И ЯЗЫКА ===================
        // ============================================================

        function switchPage() {
            if (activePageIds.length === 0) return;
            const pages = activePageIds.map(id => document.getElementById(id));
            pages[currentPageIndex].classList.remove('active');
            pages[currentPageIndex].classList.add('hidden');
            currentPageIndex = (currentPageIndex + 1) % pages.length;
            pages[currentPageIndex].classList.remove('hidden');
            pages[currentPageIndex].classList.add('active');
        }

        function switchLanguage() {
            currentLang = (currentLang === 'en') ? 'kz' : 'en';
            renderAll();
        }

        // ============================================================
        // ========== ЗАПУСК ==========================================
        // ============================================================

        // Инициализация
        activePageIds = getActivePages();
        if (activePageIds.length === 0) {
            activePageIds = ['page-timer'];
        }
        currentPageIndex = 0;
        document.querySelectorAll('.page').forEach(el => {
            el.classList.remove('active');
            el.classList.add('hidden');
        });
        const firstPage = document.getElementById(activePageIds[0]);
        if (firstPage) {
            firstPage.classList.remove('hidden');
            firstPage.classList.add('active');
        }

        renderAll();
        setInterval(switchPage, 10000);
        setInterval(switchLanguage, 6000);
        setInterval(updateTimer, 1000);
        setInterval(renderAll, 1000);
    </script>
</body>
</html>
